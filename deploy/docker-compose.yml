# 生产部署编排（不含数据库与 Nginx）。
# - 数据库使用阿里云 RDS 等第三方 MySQL；中间件 Redis 使用阿里云托管实例，
#   经镜像内 .env 的 REDIS_URL 注入，编排内仅 web / worker / beat 三个应用进程；
# - 静态文件由 WhiteNoise 直接随应用提供（collectstatic 产物），媒体文件由应用返回；
# - 镜像由 CI 构建并推送至阿里云 ACR，服务器只拉取启动，不做本地构建；
# - 运行时配置来自镜像内的 /app/.env（构建时由 .env.example 自动复制）；
#   与服务器相关的 ALLOWED_HOSTS / APP_PORT 由 CI 在宿主机环境导出后注入；
# - 数据库迁移仅由 web 入口脚本执行，worker/beat 覆盖 entrypoint 不跑迁移，避免并发冲突。
#
# 服务器目录约定（DEPLOY_PATH）：
#   deploy/docker-compose.yml     # 由流水线自动更新
#
# 手动操作（需提前在 shell 中导出 APP_IMAGE，可选 APP_PORT / ALLOWED_HOSTS）：
#   export APP_IMAGE=... APP_PORT=8004 ALLOWED_HOSTS=43.143.145.111
#   docker compose -f deploy/docker-compose.yml pull
#   docker compose -f deploy/docker-compose.yml up -d

services:
  web:
    # 由 CI 注入本次提交对应的 ACR 镜像地址
    image: ${APP_IMAGE:-registry.cn-hangzhou.aliyuncs.com/your-namespace/django-scaffold:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # 数据库等配置由镜像内 .env 提供；使用外部 RDS，跳过入口脚本的数据库等待
      SKIP_DB_WAIT: "1"
      # 浏览器访问用的域名/IP，由 CI 导出；必须保留 localhost,127.0.0.1，
      # 否则容器内 healthcheck（访问 127.0.0.1:8000）会被 Django 返回 400
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    # 宿主机端口在执行 compose 的环境中通过 APP_PORT 覆盖，默认 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media_files:/app/media
    healthcheck:
      # python:3.12-slim 自带 python，无需额外安装 curl
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Celery worker：消费 Redis 队列执行异步任务（与 web 共用镜像与 .env 配置）
  worker:
    image: ${APP_IMAGE:-registry.cn-hangzhou.aliyuncs.com/your-namespace/django-scaffold:latest}
    pull_policy: always
    restart: unless-stopped
    # 覆盖镜像入口（entrypoint.sh 会跑迁移+Gunicorn），直接起 worker
    entrypoint: []
    command: celery -A config worker -l INFO -c ${CELERY_CONCURRENCY:-2}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SKIP_DB_WAIT: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - media_files:/app/media
    # web 先完成 migrate，worker/beat 再启动
    depends_on:
      - web

  # Celery beat：周期任务调度器，从数据库（django-celery-beat）读取 Admin 配置的计划
  beat:
    image: ${APP_IMAGE:-registry.cn-hangzhou.aliyuncs.com/your-namespace/django-scaffold:latest}
    pull_policy: always
    restart: unless-stopped
    entrypoint: []
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SKIP_DB_WAIT: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - web

volumes:
  media_files:
