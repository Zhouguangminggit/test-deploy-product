# 生产部署入口：在 DEPLOY_PATH 下执行 docker compose --env-file deploy/.env -f deploy/docker-compose.yml。
# CI 为每个部署目录固定项目名，并在 deploy/.env 中记录镜像和端口。
# 兼容 .env.runtime 手工配置。中台管理的同名变量由 .env.runtime.managed 覆盖。
name: ${APP_COMPOSE_PROJECT:?set APP_COMPOSE_PROJECT for this deployment}

services:
  web:
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-224m}
    env_file:
      - path: .env.runtime
        required: false
      - path: ${APP_MANAGED_ENV_FILE:-.env.runtime.managed}
        required: false
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      # 浏览器访问用的域名/IP，由 CI 导出；本机地址供部署时探测使用
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # seedkit 图片下载密钥：由 CI 写入 deploy/.env，compose 自动读取注入
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      # 导航栏 logo 公网 URL：由 CI 写入 deploy/.env，留空时前台显示文字徽标
      SITE_LOGO: ${SITE_LOGO:-}
    # Gunicorn 在迁移和 collectstatic 完成后才开始响应，Worker 和 Beat 以此为启动条件。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, sys;
          conn = http.client.HTTPConnection("127.0.0.1", 8000, timeout=3);
          conn.request("GET", "/healthz/", headers={"User-Agent": "django-scaffold-healthcheck"});
          sys.exit(conn.getresponse().status != 200)
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 24
    # 宿主机端口在执行 compose 的环境中通过 APP_PORT 覆盖，默认 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media_files:/app/media

  # Celery worker：消费 Redis 队列执行异步任务（与 web 共用镜像与运行配置）
  worker:
    profiles: [worker]
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    env_file:
      - path: .env.runtime
        required: false
      - path: ${APP_MANAGED_ENV_FILE:-.env.runtime.managed}
        required: false
        format: raw
    # 覆盖镜像入口（entrypoint.sh 会跑迁移+Gunicorn），直接起 worker
    entrypoint: []
    command: celery -A config worker -l INFO --pool prefork -c ${CELERY_CONCURRENCY:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # seedkit 图片下载实际在 worker 执行，必须注入密钥
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - media_files:/app/media
    # web 先完成 migrate，worker/beat 再启动
    depends_on:
      web:
        condition: service_healthy

  # Celery beat：周期任务调度器，从数据库（django-celery-beat）读取 Admin 配置的计划
  beat:
    profiles: [scheduled]
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    mem_limit: ${BEAT_MEMORY_LIMIT:-128m}
    env_file:
      - path: .env.runtime
        required: false
      - path: ${APP_MANAGED_ENV_FILE:-.env.runtime.managed}
        required: false
        format: raw
    entrypoint: []
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      web:
        condition: service_healthy

  seedkit:
    profiles: [seedkit]
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: "no"
    mem_limit: ${SEEDKIT_MEMORY_LIMIT:-192m}
    env_file:
      - path: .env.runtime
        required: false
      - path: ${APP_MANAGED_ENV_FILE:-.env.runtime.managed}
        required: false
        format: raw
    entrypoint: []
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - media_files:/app/media

volumes:
  media_files:
