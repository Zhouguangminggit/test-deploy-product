# 生产部署入口：在 DEPLOY_PATH 下执行 docker compose --env-file deploy/.env -f deploy/docker-compose.yml。
# CI 为每个部署目录固定项目名，并在 deploy/.env 中记录镜像和端口。
# .env.runtime 可覆盖镜像内的 Django 环境默认值，与 Compose 插值配置分开管理。
name: ${APP_COMPOSE_PROJECT:?set APP_COMPOSE_PROJECT for this deployment}

services:
  web:
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    env_file:
      - path: .env.runtime
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      # 数据库等配置可由服务器 .env.runtime 提供；使用外部 RDS，跳过入口脚本的数据库等待
      SKIP_DB_WAIT: "1"
      # 浏览器访问用的域名/IP，由 CI 导出；本机地址供部署时探测使用
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # seedkit 图片下载密钥：由 CI 写入 deploy/.env，compose 自动读取注入
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      # 导航栏 logo 公网 URL：由 CI 写入 deploy/.env，留空时前台显示文字徽标
      SITE_LOGO: ${SITE_LOGO:-}
    # 宿主机端口在执行 compose 的环境中通过 APP_PORT 覆盖，默认 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media_files:/app/media

  # Celery worker：消费 Redis 队列执行异步任务（与 web 共用镜像与运行配置）
  worker:
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    env_file:
      - path: .env.runtime
        required: false
    # 覆盖镜像入口（entrypoint.sh 会跑迁移+Gunicorn），直接起 worker
    entrypoint: []
    command: celery -A config worker -l INFO -c ${CELERY_CONCURRENCY:-2}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      SKIP_DB_WAIT: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # seedkit 图片下载实际在 worker 执行，必须注入密钥
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - media_files:/app/media
    # web 先完成 migrate，worker/beat 再启动
    depends_on:
      web:
        condition: service_healthy

  # Celery beat：周期任务调度器，从数据库（django-celery-beat）读取 Admin 配置的计划
  beat:
    image: ${APP_IMAGE:?set APP_IMAGE for this deployment}
    restart: unless-stopped
    env_file:
      - path: .env.runtime
        required: false
    entrypoint: []
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_REDIS_KEY_PREFIX: "${APP_COMPOSE_PROJECT}:"
      SKIP_DB_WAIT: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      web:
        condition: service_healthy

volumes:
  media_files:
