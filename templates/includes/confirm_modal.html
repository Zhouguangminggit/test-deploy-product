{# 通用确认弹窗：由 static/js/common.js 暴露的 window.confirmDialog() 驱动 #}
<div id="confirm-modal" data-confirm-modal
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow-xl" role="dialog" aria-modal="true">
        <h3 class="text-lg font-semibold text-gray-900" data-confirm-title>确认操作</h3>
        <p class="mt-2 text-sm text-gray-600" data-confirm-message>确定要执行该操作吗？</p>

        <div class="mt-6 flex justify-end gap-3">
            <button type="button" data-confirm-cancel
                    class="rounded-md border border-gray-300 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">
                取消
            </button>
            <button type="button" data-confirm-ok
                    class="rounded-md bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700">
                确定
            </button>
        </div>
    </div>
</div>
