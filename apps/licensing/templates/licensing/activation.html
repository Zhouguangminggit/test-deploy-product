<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激活产品</title><style>body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:3rem 1rem}main{max-width:40rem;margin:auto;background:white;padding:2rem;border-top:8px solid #b91c1c;box-shadow:0 8px 30px #0002}h1{color:#b91c1c}input{display:block;box-sizing:border-box;width:100%;padding:.8rem;margin:.6rem 0 1rem}button{background:#b91c1c;color:white;padding:.8rem 1.2rem;border:0;border-radius:.3rem}</style></head><body><main><h1>激活产品</h1><p><strong>产品未经授权、不得二次出售，请尊重作者的知识成果；一经发现，可追究责任，后果自负。</strong></p><p>激活时将使用本机系统标识生成设备摘要并发送至授权中心，用于绑定设备；不会上传原始标识。请保持联网，更换设备请联系售后。</p>{% if error %}<p role="alert">激活失败：{{ error }}。请检查授权码和网络，或联系售后。</p>{% endif %}<form method="post">{% csrf_token %}{{ form.next }}<label for="id_code">授权码</label>{{ form.code }}{% if form.code.errors %}<p>请输入有效的授权码。</p>{% endif %}<button type="submit">联网激活</button></form></main></body></html>
