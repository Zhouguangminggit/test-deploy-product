name: Deploy

# 手动部署流水线：
#   仅支持手动触发（workflow_dispatch），可由 GitHub 页面或中台后台「触发部署」发起，
#   变量由中台以 inputs 直传，Secrets 兜底；敏感值经 inputs 时运行时自动掩码
# 变量解析规则：github.event.inputs.X || secrets.X
#
# 中台侧配置约定：workflow_file 填 deploy.yml（与本仓库 .github/workflows/deploy.yml 文件名一致）；
# 中台自动注入权威值 SSH_HOST=deploy_host、DEPLOY_PATH=deploy_path、APP_PORT=host_port，
# 其余项在全局/产品变量中以同名 var_key 配置（SSH_USER/SSH_PORT/SSH_KEY/SSH_PASSPHRASE/APP_HOST/
# ACR_REGISTRY/ACR_NAMESPACE/ACR_REPOSITORY/ACR_USERNAME/ACR_PASSWORD/COMPOSE_SERVICE）
on:
  workflow_dispatch:
    inputs:
      SSH_HOST:        { description: "服务器地址（中台自动注入 deploy_host）", required: false }
      SSH_USER:        { description: "服务器用户名", required: false }
      SSH_PORT:        { description: "SSH 端口，默认 22", required: false }
      SSH_KEY:         { description: "SSH 私钥（敏感）", required: false }
      SSH_PASSPHRASE:  { description: "私钥口令（敏感，可空）", required: false }
      DEPLOY_PATH:     { description: "服务器部署目录（中台自动注入 deploy_path）", required: false }
      APP_PORT:        { description: "宿主映射端口（中台自动注入 host_port）", required: false }
      APP_HOST:        { description: "访问域名/IP，未配置回退 SSH_HOST", required: false }
      ACR_REGISTRY:    { description: "ACR 仓库地址", required: false }
      ACR_NAMESPACE:   { description: "ACR 命名空间", required: false }
      ACR_REPOSITORY:  { description: "镜像仓库名，默认 django-scaffold", required: false }
      ACR_USERNAME:    { description: "ACR 账号（敏感）", required: false }
      ACR_PASSWORD:    { description: "ACR 密码（敏感）", required: false }
      COMPOSE_SERVICE: { description: "compose 服务名，兼容旧中台字段，部署固定更新全栈", required: false }
      DEPLOY_BRANCH:   { description: "部署分支，默认触发 ref", required: false }
      PIXABAY_API_KEY: { description: "Pixabay API 密钥（敏感，seedkit 图片下载）", required: false }
      SITE_LOGO:       { description: "导航栏logo公网URL（中台自动注入）", required: false }


concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-push:
    name: 构建镜像并推送至 ACR
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      commit: ${{ steps.image.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Resolve image
        id: image
        env:
          REGISTRY: ${{ inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ inputs.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
          IMAGE_NAME: ${{ inputs.ACR_REPOSITORY || secrets.ACR_REPOSITORY || 'django-scaffold' }}
          ACR_PASSWORD: ${{ inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}
        run: |
          set -eu
          if [ -n "$ACR_PASSWORD" ]; then echo "::add-mask::$ACR_PASSWORD"; fi
          echo "repository=$REGISTRY/$NAMESPACE/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        env:
          REGISTRY: ${{ github.event.inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          USERNAME: ${{ github.event.inputs.ACR_USERNAME || secrets.ACR_USERNAME }}
          PASSWORD: ${{ github.event.inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.PASSWORD }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # 脚手架 Dockerfile 固定在 deploy/ 下，不可写仓库根目录
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.commit }}
            ${{ steps.image.outputs.repository }}:latest
          # 构建缓存放在 GitHub Actions 缓存中：阿里云 ACR 不支持 BuildKit 的
          # registry 缓存清单（application/vnd.buildkit.cacheconfig.v0 会被拒绝）
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: 更新部署文件并部署检查
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-push.outputs.commit }}

      - name: Upload and deploy
        env:
          SSH_HOST: ${{ inputs.SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ inputs.SSH_USER || secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.SSH_PORT || secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ inputs.SSH_KEY || secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ inputs.SSH_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          DEPLOY_PATH: ${{ inputs.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          APP_PORT: ${{ inputs.APP_PORT || secrets.APP_PORT || '8000' }}
          APP_HOST: ${{ inputs.APP_HOST || secrets.APP_HOST }}
          ACR_REGISTRY: ${{ inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ inputs.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
          IMAGE_NAME: ${{ inputs.ACR_REPOSITORY || secrets.ACR_REPOSITORY || 'django-scaffold' }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.digest }}
          ACR_USERNAME: ${{ inputs.ACR_USERNAME || secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}
          PIXABAY_API_KEY: ${{ inputs.PIXABAY_API_KEY || secrets.PIXABAY_API_KEY }}
          SITE_LOGO: ${{ inputs.SITE_LOGO || secrets.SITE_LOGO }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$ACR_PASSWORD" "$PIXABAY_API_KEY" "$SSH_PASSPHRASE"; do
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done

          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          SSH_PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          DEPLOY_PATH=$(printf '%s' "$DEPLOY_PATH" | sed 's/[[:space:]]*$//')
          SSH_USER="${SSH_USER%%@*}"
          SSH_HOST="${SSH_HOST##*@}"
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" = /* ]] || { echo "::error::DEPLOY_PATH 必须是绝对路径"; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "::error::缺少 SSH_KEY"; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          umask 077
          local_stage=$(mktemp -d)
          trap 'rm -rf -- "$local_stage"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$local_stage/key"
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f "$local_stage/key" >/dev/null
          fi

          export APP_IMAGE="$ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME@$IMAGE_DIGEST"
          export ALLOWED_HOSTS="${APP_HOST:-$SSH_HOST},localhost,127.0.0.1"
          python3 - "$local_stage/compose.env" <<'PY'
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              stream.write(f"DEPLOY_REPOSITORY={os.environ['GITHUB_REPOSITORY']}\n")
              stream.write(f"APP_PORT={int(os.environ['APP_PORT'])}\n")
              for key in ("APP_IMAGE", "ALLOWED_HOSTS", "PIXABAY_API_KEY", "SITE_LOGO"):
                  value = os.environ[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"{key} 必须为单行值")
                  escaped = value.replace("\\", "\\\\").replace('"', '\\"').replace("$", "$$")
                  stream.write(f'{key}="{escaped}"\n')
          PY

          # SSH 远端使用 POSIX shell。对路径与登录参数按单引号规则转义。
          quote() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"
          }
          options=(-i "$local_stage/key" -o "Port=$SSH_PORT" -o IdentitiesOnly=yes
                   -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes)
          target="$SSH_USER@$SSH_HOST"
          remote_path=$(quote "$DEPLOY_PATH")
          remote_stage=$(ssh "${options[@]}" "$target" \
            "umask 077 && mkdir -p $remote_path/deploy && mktemp -d /tmp/scaffold-deploy.XXXXXXXX")
          [[ "$remote_stage" =~ ^/tmp/scaffold-deploy\.[a-zA-Z0-9]+$ ]]
          trap 'ssh "${options[@]}" "$target" "rm -rf -- $remote_stage"; rm -rf -- "$local_stage"' EXIT

          scp "${options[@]}" deploy/docker-compose.yml deploy/apply.sh "$local_stage/compose.env" "$target:$remote_stage/"
          printf '%s\n' "$ACR_PASSWORD" | ssh "${options[@]}" "$target" \
            "docker login $(quote "$ACR_REGISTRY") -u $(quote "$ACR_USERNAME") --password-stdin"
          ssh "${options[@]}" "$target" "sh $remote_stage/apply.sh $remote_stage $remote_path"
