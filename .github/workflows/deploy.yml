# 产品部署流水线（中台兼容版）
# 触发方式：① push 到 main（沿用原有 CI，全部走仓库 secrets）
#          ② 中台后台「触发部署」经 workflow_dispatch（合并后的环境变量以 inputs 直传）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      SSH_HOST:        { description: "部署服务器地址（中台自动注入 deploy_host）", required: false }
      SSH_USER:        { description: "SSH 用户", required: false }
      SSH_PORT:        { description: "SSH 端口", required: false }
      SSH_KEY:         { description: "SSH 私钥（多行，敏感）", required: false }
      DEPLOY_PATH:     { description: "服务器部署目录（中台自动注入 deploy_path）", required: false }
      APP_PORT:        { description: "宿主映射端口（中台自动注入 host_port）", required: false }
      ACR_REGISTRY:    { description: "ACR 仓库地址", required: false }
      ACR_NAMESPACE:   { description: "ACR 命名空间", required: false }
      ACR_USERNAME:    { description: "ACR 用户名（敏感）", required: false }
      ACR_PASSWORD:    { description: "ACR 密码（敏感）", required: false }
      IMAGE_NAME:      { description: "镜像名", required: false }
      COMPOSE_SERVICE: { description: "compose 服务名", required: false }
      DEPLOY_BRANCH:   { description: "部署分支", required: false }

# 统一取值模式：github.event.inputs.X 优先（中台触发），secrets.X 兜底（push/手动触发）
env:
  SSH_HOST: ${{ github.event.inputs.SSH_HOST || secrets.SSH_HOST }}
  SSH_USER: ${{ github.event.inputs.SSH_USER || secrets.SSH_USER }}
  SSH_PORT: ${{ github.event.inputs.SSH_PORT || secrets.SSH_PORT || '22' }}
  SSH_KEY: ${{ github.event.inputs.SSH_KEY || secrets.SSH_KEY }}
  DEPLOY_PATH: ${{ github.event.inputs.DEPLOY_PATH || secrets.DEPLOY_PATH }}
  APP_PORT: ${{ github.event.inputs.APP_PORT || secrets.APP_PORT }}
  ACR_REGISTRY: ${{ github.event.inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ github.event.inputs.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
  ACR_USERNAME: ${{ github.event.inputs.ACR_USERNAME || secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ github.event.inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}
  IMAGE_NAME: ${{ github.event.inputs.IMAGE_NAME || secrets.IMAGE_NAME || github.event.repository.name }}
  COMPOSE_SERVICE: ${{ github.event.inputs.COMPOSE_SERVICE || secrets.COMPOSE_SERVICE || 'app' }}
  DEPLOY_BRANCH: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      # ……产品特有构建步骤保持原样（如 uv sync / npm build / 单元测试）……

      - name: Build & push image (ACR)
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" -u "${ACR_USERNAME}" --password-stdin
          docker build -t "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}" .
          docker push "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          PRIVATE_KEY_FILE: ~/.ssh/deploy_key
        run: |
          SSH="ssh -i $PRIVATE_KEY_FILE -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
          SCP="scp -i $PRIVATE_KEY_FILE -P $SSH_PORT -o StrictHostKeyChecking=no"
          # 同步 compose 描述符（compose.yml/.env 存放于仓库时；无则跳过，服务器保留存量 compose）
          # $SCP compose.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/compose.yml" || true
          $SSH "bash -s" <<EOF || exit 1
          set -e
          export ACR_REGISTRY="${ACR_REGISTRY}" ACR_USERNAME="${ACR_USERNAME}" ACR_PASSWORD="${ACR_PASSWORD}"
          cd "${DEPLOY_PATH}"
          docker login "\${ACR_REGISTRY}" -u "\${ACR_USERNAME}" -p "\${ACR_PASSWORD}"
          export APP_PORT="${APP_PORT}" IMAGE_TAG="${IMAGE_TAG}"
          export IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:\${IMAGE_TAG}"
          docker compose -p "${IMAGE_NAME}" pull "${COMPOSE_SERVICE}"
          docker compose -p "${IMAGE_NAME}" up -d "${COMPOSE_SERVICE}"
          EOF