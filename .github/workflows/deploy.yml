name: Deploy

# 双通道部署流水线（保持原有 push 部署行为不变）：
#   ① push 到 main：自动触发，全部变量取仓库 Secrets（与原配置完全等价，零影响）
#   ② 中台后台「触发部署」：workflow_dispatch，变量由中台以 inputs 直传，Secrets 兜底
# 变量解析规则：github.event.inputs.X || secrets.X；敏感值经 inputs 时运行时自动掩码
#
# 中台侧配置约定：workflow_file 填 deploy.yml（与本仓库 .github/workflows/deploy.yml 文件名一致）；
# 中台自动注入权威值 SSH_HOST=deploy_host、DEPLOY_PATH=deploy_path、APP_PORT=host_port，
# 其余项在全局/产品变量中以同名 var_key 配置（SSH_USER/SSH_PORT/SSH_KEY/SSH_PASSPHRASE/APP_HOST/
# ACR_REGISTRY/ACR_NAMESPACE/ACR_REPOSITORY/ACR_USERNAME/ACR_PASSWORD/COMPOSE_SERVICE）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      SSH_HOST:        { description: "服务器地址（中台自动注入 deploy_host）", required: false }
      SSH_USER:        { description: "服务器用户名", required: false }
      SSH_PORT:        { description: "SSH 端口，默认 22", required: false }
      SSH_KEY:         { description: "SSH 私钥（敏感）", required: false }
      SSH_PASSPHRASE:  { description: "私钥口令（敏感，可空）", required: false }
      DEPLOY_PATH:     { description: "服务器部署目录（中台自动注入 deploy_path）", required: false }
      APP_PORT:        { description: "宿主映射端口（中台自动注入 host_port）", required: false }
      APP_HOST:        { description: "访问域名/IP，未配置回退 SSH_HOST", required: false }
      ACR_REGISTRY:    { description: "ACR 仓库地址", required: false }
      ACR_NAMESPACE:   { description: "ACR 命名空间", required: false }
      ACR_REPOSITORY:  { description: "镜像仓库名，默认 django-scaffold", required: false }
      ACR_USERNAME:    { description: "ACR 账号（敏感）", required: false }
      ACR_PASSWORD:    { description: "ACR 密码（敏感）", required: false }
      COMPOSE_SERVICE: { description: "compose 服务名，默认 web", required: false }
      DEPLOY_BRANCH:   { description: "部署分支，默认触发 ref", required: false }
      PIXABAY_API_KEY: { description: "Pixabay API 密钥（敏感，seedkit 图片下载）", required: false }
      SITE_LOGO:       { description: "导航栏logo公网URL（中台自动注入）", required: false }  


concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-push:
    name: 构建镜像并推送至 ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Resolve variables (inputs 优先，Secrets 兜底)
        run: |
          set -eu
          # 敏感值走 inputs 时登记运行时掩码，防止日志与后续变量泄漏
          for v in "${{ github.event.inputs.SSH_KEY }}" "${{ github.event.inputs.SSH_PASSPHRASE }}" "${{ github.event.inputs.ACR_PASSWORD }}" "${{ github.event.inputs.PIXABAY_API_KEY }}"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          IMAGE_NAME="${{ github.event.inputs.ACR_REPOSITORY || secrets.ACR_REPOSITORY }}"
          [ -n "${IMAGE_NAME}" ] || IMAGE_NAME=django-scaffold
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        env:
          REGISTRY: ${{ github.event.inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          USERNAME: ${{ github.event.inputs.ACR_USERNAME || secrets.ACR_USERNAME }}
          PASSWORD: ${{ github.event.inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # 脚手架 Dockerfile 固定在 deploy/ 下，不可写仓库根目录
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ github.event.inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ github.event.inputs.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.event.inputs.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ github.event.inputs.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          # 构建缓存放在 GitHub Actions 缓存中：阿里云 ACR 不支持 BuildKit 的
          # registry 缓存清单（application/vnd.buildkit.cacheconfig.v0 会被拒绝）
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: 更新部署文件并部署检查
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      # job 级 env 不能引用 github 上下文，这里把非敏感变量统一解析进 GITHUB_ENV 供全 job 复用；
      # 私钥/口令本体仍走后续 step 级 env，不落 GITHUB_ENV
      - name: Resolve variables (inputs 优先，Secrets 兜底)
        run: |
          set -eu
          # 敏感值走 inputs 时在本 job 登记运行时掩码（deploy job 与 build-push 独立生效）
          for v in "${{ github.event.inputs.PIXABAY_API_KEY }}"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          first_non_empty() {
            local v
            for v in "$@"; do
              if [ -n "$v" ]; then printf '%s' "$v"; return; fi
            done
          }
          {
            echo "SSH_HOST=$(first_non_empty "${{ github.event.inputs.SSH_HOST }}" "${{ secrets.SSH_HOST }}")"
            echo "SSH_USER=$(first_non_empty "${{ github.event.inputs.SSH_USER }}" "${{ secrets.SSH_USER }}")"
            echo "SSH_PORT=$(first_non_empty "${{ github.event.inputs.SSH_PORT }}" "${{ secrets.SSH_PORT }}" 22)"
            echo "DEPLOY_PATH=$(first_non_empty "${{ github.event.inputs.DEPLOY_PATH }}" "${{ secrets.DEPLOY_PATH }}")"
            echo "APP_PORT=$(first_non_empty "${{ github.event.inputs.APP_PORT }}" "${{ secrets.APP_PORT }}" 8000)"
            echo "IMAGE_NAME=$(first_non_empty "${{ github.event.inputs.ACR_REPOSITORY }}" "${{ secrets.ACR_REPOSITORY }}" django-scaffold)"
            echo "ACR_REGISTRY=$(first_non_empty "${{ github.event.inputs.ACR_REGISTRY }}" "${{ secrets.ACR_REGISTRY }}")"
            echo "ACR_NAMESPACE=$(first_non_empty "${{ github.event.inputs.ACR_NAMESPACE }}" "${{ secrets.ACR_NAMESPACE }}")"
            echo "COMPOSE_SERVICE=$(first_non_empty "${{ github.event.inputs.COMPOSE_SERVICE }}" "${{ secrets.COMPOSE_SERVICE }}" web)"
          } >> "$GITHUB_ENV"
          # APP_HOST 未配置时回退 SSH_HOST（与原流水线约定一致）
          RUN_HOST=$(first_non_empty "${{ github.event.inputs.APP_HOST }}" "${{ secrets.APP_HOST }}")
          if [ -z "${RUN_HOST}" ]; then RUN_HOST="${SSH_HOST}"; fi
          echo "APP_HOST=${RUN_HOST}" >> "$GITHUB_ENV"

      # 直接用 runner 自带 OpenSSH（与本地 ssh 行为一致），避免第三方容器的兼容性问题
      - name: Upload docker-compose.yml
        env:
          SSH_KEY: ${{ github.event.inputs.SSH_KEY || secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ github.event.inputs.SSH_PASSPHRASE || secrets.SSH_PASSPHRASE }}
        run: |
          set -eu

          # 清理 Secret/inputs 中可能混入的空格/换行，并兼容误填成 user@host 的写法
          SSH_USER=$(printf '%s' "${SSH_USER}" | tr -d '[:space:]')
          SSH_HOST=$(printf '%s' "${SSH_HOST}" | tr -d '[:space:]')
          SSH_PORT=$(printf '%s' "${SSH_PORT}" | tr -d '[:space:]')
          DEPLOY_PATH=$(printf '%s' "${DEPLOY_PATH}" | sed 's/[[:space:]]*$//')
          SSH_USER="${SSH_USER%%@*}"
          SSH_HOST="${SSH_HOST##*@}"
          [ -n "${SSH_PORT}" ] || SSH_PORT=22

          case "${SSH_USER}" in
            ""|*[!A-Za-z0-9._-]*) echo "::error::SSH_USER 为空或含非法字符，应只填写登录用户名（如 root）"; exit 1 ;;
          esac
          case "${SSH_HOST}" in
            ""|*[!A-Za-z0-9.-]*) echo "::error::SSH_HOST 为空或含非法字符，应只填写域名/IP（不要带 user@ 或端口）"; exit 1 ;;
          esac
          case "${SSH_PORT}" in
            *[!0-9]*) echo "::error::SSH_PORT 只能是数字"; exit 1 ;;
          esac
          [ -n "${DEPLOY_PATH}" ] || { echo "::error::DEPLOY_PATH 为空"; exit 1; }
          [ -n "${SSH_KEY}" ] || { echo "::error::SSH_KEY 为空，请确认私钥已配置（仓库 Secrets 或中台全局变量）"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_PASSPHRASE}" ]; then
            ssh-keygen -p -P "${SSH_PASSPHRASE}" -N "" -f ~/.ssh/deploy_key >/dev/null
          fi

          echo "本次部署使用的公钥指纹（应与服务器 authorized_keys 中一致）："
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          ssh-keygen -lf /tmp/deploy_key.pub

          # 用 -o Port= 同时兼容 ssh 与 scp（scp 的 -P 与 ssh 的 -p 含义不同）
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o Port=${SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          if ! ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" 'echo "连接成功：$(whoami)@$(hostname)"'; then
            echo "::error::SSH 连接失败：请确认用户 ${SSH_USER} 的 ~/.ssh/authorized_keys 中包含上面指纹对应的公钥"
            exit 1
          fi

          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/deploy'"
          scp $SSH_OPTS deploy/docker-compose.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/deploy/docker-compose.yml"

      # 远端脚本中的 ${{ ... }} 全部由 runner 侧展开为字面量后再下发（与原流水线一致），
      # 不依赖 appleboy envs 转发，规避 drone-ssh 未导出变量导致的 unbound variable
      - name: Pull, restart and health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ github.event.inputs.SSH_KEY || secrets.SSH_KEY }}
          passphrase: ${{ github.event.inputs.SSH_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -eu

            cd "${{ env.DEPLOY_PATH }}"

            # ACR 账号密码等 Secrets/inputs 只在 runner 侧展开，SSH 远端脚本无法引用，
            # 因此这里先在 runner 上拼好镜像地址、端口和域名，再写入服务器
            # deploy/.env，供服务器侧（含中台系统/人工 SSH）执行 compose 时自动读取
            REPO="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
            ALLOWED="${{ env.APP_HOST }},localhost,127.0.0.1"
            COMPOSE="docker compose -f deploy/docker-compose.yml"

            echo "==> 登录 ACR"
            echo "${{ github.event.inputs.ACR_PASSWORD || secrets.ACR_PASSWORD }}" | docker login "${{ env.ACR_REGISTRY }}" \
              -u "${{ github.event.inputs.ACR_USERNAME || secrets.ACR_USERNAME }}" --password-stdin

            # 落地 compose 环境变量文件：APP_IMAGE 固定 :latest（CI 每次部署都会
            # 推送最新 sha 镜像到 :latest），中台仅执行 up -d 也能拉到最新版本；
            # 本次部署仍显式使用 sha tag，保证与流水线产物严格对应
            # 用 printf 而非 heredoc，避免 YAML 块缩进被写进 .env 行首
            printf 'APP_IMAGE=%s\nAPP_PORT=%s\nALLOWED_HOSTS=%s\nPIXABAY_API_KEY=%s\nSITE_LOGO=%s\n' \
              "${REPO}:latest" "${{ env.APP_PORT }}" "${ALLOWED}" "${{ github.event.inputs.PIXABAY_API_KEY || secrets.PIXABAY_API_KEY }}" "${{ github.event.inputs.SITE_LOGO || secrets.SITE_LOGO }}" > deploy/.env

            echo "==> 拉取镜像 ${REPO}:${{ github.sha }}"
            APP_IMAGE="${REPO}:${{ github.sha }}" ALLOWED_HOSTS="${ALLOWED}" $COMPOSE pull "${{ env.COMPOSE_SERVICE }}"

            echo "==> 重启服务"
            APP_IMAGE="${REPO}:${{ github.sha }}" ALLOWED_HOSTS="${ALLOWED}" \
              $COMPOSE up -d --remove-orphans

            echo "==> 等待健康检查通过"
            for i in $(seq 1 30); do
              if $COMPOSE exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"; then
                echo "部署成功"
                exit 0
              fi
              echo "第 ${i} 次检查未通过"
              sleep 5
            done

            $COMPOSE logs --tail=100 "${{ env.COMPOSE_SERVICE }}"
            echo "健康检查超时"
            exit 1
